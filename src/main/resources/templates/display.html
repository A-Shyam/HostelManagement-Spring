<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
	<div align="center">
        <h1>Details</h1>
        <table border="1">
            <tr>
                <th>Pg Name</th>
                <th>Tenet Name</th>
                <th>Phone number</th>
                <th>Fee</th>
                <th>Room number</th>
                <th>Joined Date</th>
            </tr>
            <tr th:each="p : ${details}">
                <td th:text="${p.pgName}"></td>
                <td th:text="${p.tenetName}"></td>
                <td th:text="${p.number}"></td>
                <td th:text="${p.fee}"></td>
                <td th:text="${p.roomno}"></td>
                <td th:text="${p.joindate}"></td>
                
                <td>
                    <a th:href ="'/edit?id='+${p.id}"><button>Edit</button></a>
                    <a th:href="'/delete?id='+${p.id}"><button>Delete </button></a>

                </td>
            </tr>
        </table>
        <a href="/"><button>back</button></a>
    </div>
</body>
</html>
